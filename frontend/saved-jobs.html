<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireHub - Saved Jobs</title>
<style>
    * { margin:0; padding:0; font-family:Poppins,sans-serif; box-sizing:border-box; }
    body { background:#f5f6fa; }

    .navbar {
        background:#0a66c2;
        padding:15px 30px;
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    .navbar h2 { font-size:22px; }
    .navbar button {
        background:white; color:#0a66c2; border:none;
        padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600;
    }

    .container {
        padding:25px;
        max-width:1000px;
        margin:0 auto;
    }

    .page-header {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
    }

    .page-header h2 { color:#0a66c2; }

    .job-card {
        background:white;
        padding:20px;
        border-radius:8px;
        box-shadow:0 1px 4px rgba(0,0,0,0.1);
        margin-bottom:20px;
        border-left:5px solid #0a66c2;
    }
    .job-card h3 { color:#0a66c2; margin-bottom:6px; }
    .job-card p { margin:4px 0; color:#444; font-size:15px; }

    .job-card .btn-group {
        margin-top:12px;
        display:flex;
        gap:10px;
    }

    .job-card button {
        border:none;
        padding:8px 14px;
        border-radius:6px;
        cursor:pointer;
        font-weight:600;
        font-size:14px;
    }

    .apply-btn { background:#0a66c2; color:white; }
    .apply-btn:hover { background:#084d94; }

    .remove-btn { background:#ff4d4d; color:white; }
    .remove-btn:hover { background:#d93636; }

    .badge {
        background:#0a66c2;
        color:white;
        padding:3px 10px;
        border-radius:12px;
        font-size:12px;
        font-weight:600;
        margin-left:8px;
    }

    #loadingMsg { text-align:center; padding:40px; color:#666; }
    #emptyMsg {
        text-align:center;
        padding:40px;
        color:#888;
        font-size:16px;
        display:none;
    }
</style>
</head>
<body>

<div class="navbar">
    <h2>📌 Saved Jobs</h2>
    <button onclick="location.href='dashboard.html'">Dashboard</button>
</div>

<div class="container">
    <div class="page-header">
        <h2>Your Saved Jobs <span class="badge" id="savedCount">0</span></h2>
    </div>
    <div id="loadingMsg">Loading saved jobs...</div>
    <div id="jobList"></div>
    <div id="emptyMsg">📭 You haven't saved any jobs yet. <a href="jobs.html" style="color:#0a66c2;font-weight:600;">Browse Jobs →</a></div>
</div>

<script src="js/api.js"></script>
<script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    async function loadSavedJobs() {
        const list = document.getElementById('jobList');
        const loading = document.getElementById('loadingMsg');
        const empty = document.getElementById('emptyMsg');

        loading.style.display = 'block';
        empty.style.display = 'none';
        list.innerHTML = '';

        try {
            const res = await UsersAPI.getSavedJobs();
            loading.style.display = 'none';

            if (!res.ok || !res.data.success) {
                list.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Failed to load saved jobs.</p>';
                return;
            }

            const savedJobs = res.data.savedJobs;
            document.getElementById('savedCount').textContent = savedJobs.length;

            if (!savedJobs || savedJobs.length === 0) {
                empty.style.display = 'block';
                return;
            }

            savedJobs.forEach(saved => {
                const job = saved.job;
                const typeLabel = (job.jobType || 'FULL_TIME').replace('_', ' ');
                const card = document.createElement('div');
                card.className = 'job-card';
                card.id = `saved-${saved.id}`;
                card.innerHTML = `
                    <h3>${escapeHtml(job.title)}</h3>
                    <p>🏢 <strong>${escapeHtml(job.company || '')}</strong></p>
                    <p>📍 ${escapeHtml(job.location)} | 💼 ${escapeHtml(job.experience || 'Not specified')}</p>
                    <p>🛠 ${escapeHtml(job.skills || 'Skills not listed')}</p>
                    <p style="font-size:13px;color:#888;margin-top:4px;">Type: ${escapeHtml(typeLabel)}</p>
                    <div class="btn-group">
                        <button class="apply-btn" onclick="location.href='apply.html?jobId=${job.id}'">Apply Now</button>
                        <button class="remove-btn" onclick="handleRemove(${job.id}, ${saved.id}, this)">Remove</button>
                    </div>
                `;
                list.appendChild(card);
            });

        } catch (e) {
            loading.style.display = 'none';
            list.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Network error loading saved jobs.</p>';
        }
    }

    async function handleRemove(jobId, savedId, btn) {
        btn.disabled = true;
        btn.textContent = 'Removing...';
        try {
            const res = await UsersAPI.saveJob(jobId); // toggles save/unsave
            if (res.ok && res.data.success) {
                // Remove the card
                const card = document.querySelector(`#saved-${savedId}`) || btn.closest('.job-card');
                if (card) card.remove();

                // Update count
                const countEl = document.getElementById('savedCount');
                const current = parseInt(countEl.textContent) || 0;
                countEl.textContent = Math.max(0, current - 1);

                showToast('Job removed from saved list', 'success');

                if (document.querySelectorAll('.job-card').length === 0) {
                    document.getElementById('emptyMsg').style.display = 'block';
                }
            } else {
                showToast(res.data.message || 'Failed to remove job', 'error');
                btn.disabled = false;
                btn.textContent = 'Remove';
            }
        } catch (e) {
            showToast('Network error removing job', 'error');
            btn.disabled = false;
            btn.textContent = 'Remove';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (!requireAuth('CANDIDATE')) return;
        loadSavedJobs();
    });
</script>
</body>
</html>
