<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireHub - Manage Users</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Poppins, sans-serif;
}

body {
  background: #f5f6fa;
}

.navbar {
  background: #0a66c2;
  padding: 15px 30px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar h2 {
  font-size: 22px;
}

.navbar button {
  background: white;
  color: #0a66c2;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}

.content {
  padding: 30px;
  width: 100%;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

h3 {
  color: #0a66c2;
  margin-bottom: 15px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border: 1px solid #ddd;
  text-align: left;
}

th {
  background: #f1f7ff;
  color: #0a66c2;
}

button.action-btn {
  padding: 6px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  color: white;
  background: #0a66c2;
  margin-right: 5px;
}

button.deactivate-btn {
  background: #e74c3c;
}

@media (max-width:768px) {
  table, th, td {
    font-size: 14px;
  }
}
</style>

</head>
<body>

<div class="navbar">
  <h2>HireHub Admin - Manage Users</h2>
  <button onclick="location.href='admin-dashboard.html'">⬅ Back to Dashboard</button>
</div>

<div class="content">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
      <h3 style="margin-bottom:0;">Manage Users</h3>
      <span id="userCountBadge" style="background:#0a66c2;color:white;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600;"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="6" style="text-align:center;padding:20px;color:#666;">Loading users...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth('ADMIN')) return;
    loadUsers();
});

async function loadUsers() {
    const tbody = document.getElementById('usersTableBody');
    try {
        const res = await UsersAPI.getAll({ limit: 50 });
        if (res.ok && res.data && res.data.users) {
            tbody.innerHTML = '';
            document.getElementById('userCountBadge').textContent = `Total: ${res.data.total || res.data.users.length}`;

            res.data.users.forEach(u => {
                const tr = document.createElement('tr');
                const roleBadge = u.role === 'ADMIN' ? 'Admin' : u.role === 'RECRUITER' ? 'HR / Recruiter' : 'Candidate';
                const statusColor = u.isActive ? '#28a745' : '#e74c3c';
                const statusText = u.isActive ? 'Active' : 'Inactive';
                const toggleBtnText = u.isActive ? 'Deactivate' : 'Activate';
                const toggleClass = u.isActive ? 'action-btn deactivate-btn' : 'action-btn';
                const isCurrentAdmin = Auth.getUser() && Auth.getUser().id === u.id;

                tr.innerHTML = `
                    <td>#${u.id}</td>
                    <td class="name"><strong>${escapeHtml(u.name)}</strong></td>
                    <td>${escapeHtml(u.email)}</td>
                    <td>${roleBadge}</td>
                    <td class="status" style="font-weight:600;color:${statusColor};">${statusText}</td>
                    <td>
                        ${isCurrentAdmin 
                            ? '<span style="color:#888;font-size:13px;">(Current Account)</span>' 
                            : `<button class="${toggleClass}" onclick="handleToggleActive(${u.id}, this)">${toggleBtnText}</button>
                               <button class="action-btn" style="background:#555;" onclick="handleDeleteUser(${u.id}, '${escapeHtml(u.name)}', this)">Delete</button>`
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:red;padding:15px;">Failed to load users from server.</td></tr>';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
}

async function handleToggleActive(userId, btn) {
    btn.disabled = true;
    try {
        const res = await UsersAPI.toggleActive(userId);
        if (res.ok && res.data.success) {
            showToast(res.data.message || 'Status updated', 'success');
            loadUsers();
        } else {
            showToast(res.data.message || 'Failed to toggle status', 'error');
            btn.disabled = false;
        }
    } catch (e) {
        showToast('Network error updating user', 'error');
        btn.disabled = false;
    }
}

async function handleDeleteUser(userId, userName, btn) {
    if (!confirm(`Are you sure you want to permanently delete user "${userName}"?`)) return;
    btn.disabled = true;
    try {
        const res = await UsersAPI.delete(userId);
        if (res.ok && res.data.success) {
            showToast(`User "${userName}" deleted.`, 'success');
            loadUsers();
        } else {
            showToast(res.data.message || 'Failed to delete user', 'error');
            btn.disabled = false;
        }
    } catch (e) {
        showToast('Network error deleting user', 'error');
        btn.disabled = false;
    }
}
</script>
</body>
</html>
