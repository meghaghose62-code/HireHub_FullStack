<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireHub - Post Job</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; }
    body { background:#f5f6fa; }
    .navbar { background:#0a66c2; padding:15px 30px; color:white; display:flex; justify-content:space-between; align-items:center; }
    .navbar h2 { font-size:22px; }
    .navbar button { background:white; color:#0a66c2; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; }

    .container { padding:25px; }
    .card { background:white; padding:20px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.1); max-width:500px; margin:auto; }
    h3 { color:#0a66c2; margin-bottom:10px; }
    input, textarea, select { width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #ccc; font-size:15px; }
    button { padding:10px 20px; background:#0a66c2; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600; margin-top:10px; }
    button:hover { background:#084d94; }
    label { font-weight:500; }
</style>
</head>
<body>

<div class="navbar">
    <h2>HireHub - Post New Job</h2>
    <button onclick="location.href='recruiter-dashboard.html'">Back</button>
</div>

<div class="container">
    <div class="card">
        <h3>Post a New Job</h3>
        <form id="postJobForm" onsubmit="handlePostJob(event)">
            <label>Job Title</label>
            <input type="text" id="jobTitle" placeholder="Frontend Developer" required>

            <label>Company Name</label>
            <input type="text" id="jobCompany" placeholder="Tech Solutions" required>

            <label>Location</label>
            <input type="text" id="jobLocation" placeholder="City or Remote" required>

            <label>Job Type</label>
            <select id="jobType" required>
                <option value="FULL_TIME">Full Time</option>
                <option value="PART_TIME">Part Time</option>
                <option value="INTERNSHIP">Internship</option>
                <option value="REMOTE">Remote</option>
            </select>

            <label>Experience Required (e.g. 2-4 years)</label>
            <input type="text" id="jobExperience" placeholder="e.g. 2-4 years" required>

            <label>Salary (₹ per annum)</label>
            <input type="text" id="jobSalary" placeholder="e.g. ₹10-15 LPA" value="₹8-12 LPA" required>

            <label>Skills Required</label>
            <input type="text" id="jobSkills" placeholder="React, JavaScript, Tailwind CSS" required>

            <label>Job Description</label>
            <textarea id="jobDescription" rows="4" placeholder="Describe job responsibilities..." required></textarea>

            <p id="postJobError" style="color:red;font-size:14px;text-align:center;margin-top:6px;"></p>

            <button type="submit" id="postJobBtn">Post Job</button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        if (!requireAuth('RECRUITER')) return;
    });

    async function handlePostJob(event) {
        event.preventDefault();
        const btn = document.getElementById('postJobBtn');
        const errEl = document.getElementById('postJobError');
        errEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Posting...';

        const payload = {
            title: document.getElementById('jobTitle').value.trim(),
            company: document.getElementById('jobCompany').value.trim(),
            location: document.getElementById('jobLocation').value.trim(),
            jobType: document.getElementById('jobType').value,
            experience: document.getElementById('jobExperience').value.trim(),
            salary: document.getElementById('jobSalary').value.trim(),
            skills: document.getElementById('jobSkills').value.trim(),
            description: document.getElementById('jobDescription').value.trim()
        };

        try {
            const res = await JobsAPI.post(payload);
            if (res.ok && res.data.success) {
                window.location.href = 'job-post-success.html';
            } else {
                errEl.textContent = res.data.message || 'Failed to post job.';
                btn.disabled = false;
                btn.textContent = 'Post Job';
            }
        } catch (err) {
            errEl.textContent = 'Network error posting job.';
            btn.disabled = false;
            btn.textContent = 'Post Job';
        }
    }
</script>
</body>
</html>
