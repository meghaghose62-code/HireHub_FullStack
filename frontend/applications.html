<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireHub - Job Applications</title>
<style>
    * { margin:0; padding:0; font-family:Poppins,sans-serif; box-sizing:border-box; }
    body { background:#f5f6fa; }

    .navbar {
        background:#0a66c2;
        padding:15px 30px;
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    .navbar h2 { font-size:22px; }
    .navbar button {
        background:white; color:#0a66c2; border:none;
        padding:8px 16px; border-radius:6px;
        cursor:pointer; font-weight:600;
    }

    .container { padding:25px; max-width:1200px; margin:0 auto; }

    .page-header { margin-bottom:20px; }
    .page-header h2 { color:#0a66c2; }
    .page-header p { color:#555; font-size:14px; margin-top:4px; }

    table {
        width:100%;
        background:white;
        border-collapse:collapse;
        border-radius:8px;
        overflow:hidden;
        box-shadow:0 1px 4px rgba(0,0,0,0.1);
    }

    th, td {
        padding:12px 14px;
        text-align:left;
        border-bottom:1px solid #ddd;
        font-size:14px;
    }

    th { background:#0a66c2; color:white; font-weight:600; }

    .status-badge {
        padding:3px 10px;
        border-radius:12px;
        font-size:12px;
        font-weight:700;
    }
    .status-PENDING { background:#fff3cd; color:#856404; }
    .status-REVIEWED { background:#cce5ff; color:#004085; }
    .status-SHORTLISTED { background:#d4edda; color:#155724; }
    .status-REJECTED { background:#f8d7da; color:#721c24; }
    .status-HIRED { background:#d1ecf1; color:#0c5460; font-weight:800; }

    .action-btn {
        border:none;
        padding:5px 10px;
        border-radius:4px;
        cursor:pointer;
        margin-right:4px;
        font-size:13px;
        font-weight:600;
    }
    .btn-shortlist { background:#28a745; color:white; }
    .btn-reject { background:#dc3545; color:white; }
    .btn-interview { background:#007bff; color:white; }
    .btn-hired { background:#6f42c1; color:white; }
    .btn-resume { background:#6c757d; color:white; }

    select.status-select {
        padding:4px 8px;
        border:1px solid #ccc;
        border-radius:4px;
        font-size:13px;
        cursor:pointer;
    }

    #loadingMsg { text-align:center; padding:40px; color:#666; }
    #emptyMsg { text-align:center; padding:40px; color:#888; font-size:15px; display:none; }

    .filter-row {
        display:flex;
        gap:12px;
        margin-bottom:15px;
        flex-wrap:wrap;
        align-items:center;
    }
    .filter-row select {
        padding:8px 12px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:14px;
        background:white;
    }
    .filter-row label { font-weight:600; color:#444; }
</style>
</head>
<body>

<div class="navbar">
    <h2>Job Applications</h2>
    <button onclick="history.back()">Go Back</button>
</div>

<div class="container">
    <div class="page-header">
        <h2 id="pageTitle">📄 Applications</h2>
        <p id="pageSubtitle">Loading...</p>
    </div>

    <div class="filter-row">
        <label>Filter by Status:</label>
        <select id="statusFilter" onchange="applyFilter()">
            <option value="">All Applications</option>
            <option value="PENDING">Pending</option>
            <option value="REVIEWED">Reviewed</option>
            <option value="SHORTLISTED">Shortlisted</option>
            <option value="REJECTED">Rejected</option>
            <option value="HIRED">Hired</option>
        </select>
    </div>

    <div id="loadingMsg">Loading applications...</div>
    <div id="emptyMsg">📭 No applications found for this job.</div>

    <div id="tableContainer" style="display:none;">
        <table id="applicationsTable">
            <thead>
                <tr id="tableHeaderRow">
                    <th>Applicant</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Applied On</th>
                    <th>Status</th>
                    <th>Resume</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="appTableBody"></tbody>
        </table>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    let allApplications = [];
    let isCandidateView = false;

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    function statusBadge(status) {
        return `<span class="status-badge status-${status}">${status}</span>`;
    }

    async function loadApplications() {
        const loading = document.getElementById('loadingMsg');
        const empty = document.getElementById('emptyMsg');
        const tableContainer = document.getElementById('tableContainer');

        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('jobId');
        const role = Auth.getRole();
        isCandidateView = (role === 'CANDIDATE');

        loading.style.display = 'block';
        empty.style.display = 'none';
        tableContainer.style.display = 'none';

        try {
            let res;
            if (isCandidateView) {
                res = await ApplicationsAPI.getMine();
                document.getElementById('pageTitle').textContent = '📄 My Submitted Applications';
                document.getElementById('pageSubtitle').textContent = 'Track status, interviews, and invoices for your job applications';
                // Adjust header for candidate
                const headerRow = document.getElementById('tableHeaderRow');
                if (headerRow) {
                    headerRow.innerHTML = `
                        <th>Job Title</th>
                        <th>Company</th>
                        <th>Applied On</th>
                        <th>Status</th>
                        <th>Resume</th>
                        <th>Actions</th>
                    `;
                }
            } else if (jobId) {
                res = await ApplicationsAPI.getByJob(jobId);
                document.getElementById('pageTitle').textContent = '📄 Applications';
                try {
                    const jobRes = await JobsAPI.getById(jobId);
                    if (jobRes.ok && jobRes.data.job) {
                        document.getElementById('pageTitle').textContent = `📄 Applications for: ${escapeHtml(jobRes.data.job.title)}`;
                        document.getElementById('pageSubtitle').textContent =
                            `${jobRes.data.job.company} · ${jobRes.data.job.location}`;
                    }
                } catch (e) {}
            } else if (role === 'ADMIN') {
                res = await ApplicationsAPI.getAll();
                document.getElementById('pageTitle').textContent = '📄 All Applications';
                document.getElementById('pageSubtitle').textContent = 'Admin overview of all submitted candidate applications';
            } else if (role === 'RECRUITER') {
                res = await ApplicationsAPI.getRecruiterMine();
                document.getElementById('pageTitle').textContent = '📄 Received Job Applications';
                document.getElementById('pageSubtitle').textContent = 'All applications submitted to your active job postings';
            } else {
                loading.style.display = 'none';
                empty.textContent = 'Access denied.';
                empty.style.display = 'block';
                return;
            }

            loading.style.display = 'none';

            if (!res.ok || !res.data.success) {
                empty.textContent = res.data.message || 'Failed to load applications.';
                empty.style.display = 'block';
                return;
            }

            allApplications = res.data.applications || [];

            if (allApplications.length === 0) {
                empty.textContent = isCandidateView
                    ? '📭 You have not submitted any job applications yet.'
                    : '📭 No applications found.';
                empty.style.display = 'block';
                return;
            }

            tableContainer.style.display = 'block';
            renderTable(allApplications);

        } catch (e) {
            loading.style.display = 'none';
            empty.textContent = 'Network error loading applications.';
            empty.style.display = 'block';
        }
    }

    function renderTable(apps) {
        const tbody = document.getElementById('appTableBody');
        tbody.innerHTML = '';

        if (apps.length === 0) {
            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('emptyMsg').textContent = 'No applications match this filter.';
            document.getElementById('emptyMsg').style.display = 'block';
            return;
        }

        document.getElementById('tableContainer').style.display = 'block';
        document.getElementById('emptyMsg').style.display = 'none';

        apps.forEach(app => {
            const candidate = app.candidate || {};
            const job = app.job || {};
            const appliedDate = new Date(app.appliedAt).toLocaleDateString('en-IN', {
                day:'numeric', month:'short', year:'numeric'
            });

            const tr = document.createElement('tr');

            if (isCandidateView) {
                // Candidate View
                tr.innerHTML = `
                    <td>
                        <strong>${escapeHtml(job.title || 'Job')}</strong>
                        <br><small style="color:#666;">${escapeHtml(job.location || '')} · ${escapeHtml(job.jobType ? job.jobType.replace('_', ' ') : '')}</small>
                    </td>
                    <td><strong>${escapeHtml(job.company || '-')}</strong></td>
                    <td>${appliedDate}</td>
                    <td>${statusBadge(app.status)}</td>
                    <td>
                        ${app.resume
                            ? `<span style="font-size:13px;color:#333;">📎 ${escapeHtml(app.resume.fileName || 'Resume')}</span>`
                            : '<span style="color:#888;font-size:13px;">None</span>'
                        }
                    </td>
                    <td>
                        <button class="action-btn" style="background:#0a66c2;color:white;" onclick="downloadInvoice(${app.id}, this)">📥 Invoice (PDF)</button>
                    </td>
                `;
            } else {
                // Recruiter / Admin View
                const candidateId = candidate.id || app.candidateId;
                const jobId = job.id || app.jobId;

                tr.innerHTML = `
                    <td>
                        <a href="view-application.html?id=${app.id}" style="color:#0a66c2;text-decoration:none;font-weight:700;">
                            ${escapeHtml(candidate.name || 'Candidate')}
                        </a>
                        ${job.title ? `<br><small style="color:#666;">${escapeHtml(job.title)}</small>` : ''}
                    </td>
                    <td>${escapeHtml(candidate.email || '-')}</td>
                    <td>${escapeHtml(candidate.phone || '-')}</td>
                    <td>${appliedDate}</td>
                    <td>${statusBadge(app.status)}</td>
                    <td>
                        ${app.resume && app.resume.filePath
                            ? `<a href="${escapeHtml(app.resume.filePath)}" target="_blank" class="action-btn btn-resume" style="text-decoration:none;display:inline-block;">📎 View</a>`
                            : '<span style="color:#888;font-size:13px;">No resume</span>'
                        }
                    </td>
                    <td>
                        <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">
                            <a href="view-application.html?id=${app.id}" class="action-btn" style="background:#17a2b8;color:white;text-decoration:none;display:inline-block;">👁 View</a>
                            <select class="status-select" onchange="handleStatusChange(${app.id}, this.value, this)" title="Update status">
                                <option value="">Status...</option>
                                <option value="REVIEWED" ${app.status==='REVIEWED'?'selected':''}>Reviewed</option>
                                <option value="SHORTLISTED" ${app.status==='SHORTLISTED'?'selected':''}>Shortlist</option>
                                <option value="REJECTED" ${app.status==='REJECTED'?'selected':''}>Reject</option>
                                <option value="HIRED" ${app.status==='HIRED'?'selected':''}>Hire</option>
                            </select>
                            ${candidateId ? `<button class="action-btn btn-interview" onclick="location.href='schedule-interview.html?applicationId=${app.id}&candidateId=${candidateId}&jobId=${jobId}'">📅 Interview</button>` : ''}
                            <button class="action-btn" style="background:#6c757d;color:white;" onclick="downloadInvoice(${app.id}, this)">📥 PDF</button>
                        </div>
                    </td>
                `;
            }
            tbody.appendChild(tr);
        });
    }

    function applyFilter() {
        const filterVal = document.getElementById('statusFilter').value;
        const filtered = filterVal
            ? allApplications.filter(a => a.status === filterVal)
            : allApplications;
        renderTable(filtered);
    }

    async function handleStatusChange(appId, status, selectEl) {
        if (!status) return;
        selectEl.disabled = true;
        try {
            const res = await ApplicationsAPI.updateStatus(appId, status);
            if (res.ok && res.data.success) {
                showToast(`Status updated to ${status}`, 'success');
                const app = allApplications.find(a => a.id === appId);
                if (app) app.status = status;
                const row = selectEl.closest('tr');
                if (row) {
                    const statusCell = row.cells[4];
                    statusCell.innerHTML = `<span class="status-badge status-${status}">${status}</span>`;
                }
            } else {
                showToast(res.data.message || 'Failed to update status', 'error');
            }
        } catch (e) {
            showToast('Network error updating status', 'error');
        }
        selectEl.value = '';
        selectEl.disabled = false;
    }

    async function downloadInvoice(appId, btn) {
        const origText = btn.textContent;
        btn.textContent = 'Downloading...';
        btn.disabled = true;
        try {
            await ApplicationsAPI.downloadInvoice(appId);
            btn.textContent = '✓ Downloaded';
            setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 2000);
        } catch (e) {
            alert(e.message || 'Could not download invoice PDF.');
            btn.textContent = origText;
            btn.disabled = false;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (!Auth.isLoggedIn()) { window.location.href = 'login.html'; return; }
        loadApplications();
    });
</script>
</body>
</html>
