<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireHub - Schedule Interview</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; }
    body { background:#f5f6fa; }
    .navbar { background:#0a66c2; padding:15px 30px; color:white; display:flex; justify-content:space-between; align-items:center; }
    .navbar h2 { font-size:22px; }
    .navbar button { background:white; color:#0a66c2; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; }

    .container { padding:25px; }
    .card { background:white; padding:25px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.1); max-width:560px; margin:auto; }
    .card h3 { color:#0a66c2; margin-bottom:15px; font-size:20px; }

    label { font-weight:600; display:block; margin-top:14px; color:#333; }
    input, select, textarea {
        width:100%; padding:10px; margin-top:6px;
        border-radius:6px; border:1px solid #ccc;
        font-family:Poppins,sans-serif; font-size:14px;
    }

    .candidate-banner {
        background:#eef5ff;
        border-left:4px solid #0a66c2;
        padding:12px;
        border-radius:4px;
        margin-bottom:15px;
    }
    .candidate-banner strong { color:#0a66c2; }

    button.submit-btn {
        width:100%; padding:12px; background:#0a66c2;
        color:white; border:none; border-radius:6px;
        cursor:pointer; font-size:16px; font-weight:600;
        margin-top:20px;
    }
    button.submit-btn:hover { background:#084d94; }
    button.submit-btn:disabled { background:#ccc; cursor:not-allowed; }

    #statusMsg { text-align:center; margin-top:12px; font-size:14px; font-weight:600; }
    #formError { color:red; font-size:13px; margin-top:8px; text-align:center; }
</style>
</head>
<body>

<div class="navbar">
    <h2>HireHub - Schedule Interview</h2>
    <button onclick="history.back()">Back</button>
</div>

<div class="container">
    <div class="card">
        <h3>📅 Schedule an Interview</h3>

        <div class="candidate-banner" id="candidateBanner" style="display:none;">
            <strong id="bannerCandidateName"></strong>
            <div id="bannerJobTitle" style="font-size:13px;color:#555;margin-top:3px;"></div>
        </div>

        <form id="interviewForm" onsubmit="handleSchedule(event)">

            <label>Application ID (optional / auto-filled)</label>
            <input type="number" id="applicationId" placeholder="Application ID">

            <label>Candidate ID <span id="candidateIdNote" style="color:#e74c3c;font-size:12px;"></span></label>
            <input type="number" id="candidateId" placeholder="Candidate User ID" required readonly style="background:#f5f5f5;color:#555;">

            <label>Job ID <span id="jobIdNote" style="color:#e74c3c;font-size:12px;"></span></label>
            <input type="number" id="jobId" placeholder="Job ID" required readonly style="background:#f5f5f5;color:#555;">

            <label>Date & Time</label>
            <input type="datetime-local" id="scheduledAt" required>

            <label>Mode</label>
            <select id="mode" required>
                <option value="Online">Online (Video Call)</option>
                <option value="Offline">Offline (In Person)</option>
                <option value="Phone">Phone Call</option>
            </select>

            <label>Location / Link (optional)</label>
            <input type="text" id="location" placeholder="e.g. Office Room 3B, or Zoom link">

            <label>Notes for Candidate (optional)</label>
            <textarea id="notes" rows="3" placeholder="Any instructions or details for the candidate..."></textarea>

            <p id="formError"></p>

            <button type="submit" class="submit-btn" id="scheduleBtn">Schedule Interview</button>
        </form>

        <p id="statusMsg"></p>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    async function prefillFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        const applicationId = urlParams.get('applicationId') || urlParams.get('appId');
        const candidateId = urlParams.get('candidateId');
        const jobId = urlParams.get('jobId');

        // Set default datetime to tomorrow at 10AM
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(10, 0, 0, 0);
        const localDateTimeStr = tomorrow.toISOString().slice(0, 16);
        document.getElementById('scheduledAt').value = localDateTimeStr;

        function lockIdField(id) {
            const el = document.getElementById(id);
            el.readOnly = true;
            el.style.background = '#eef4ff';
            el.style.color = '#0a66c2';
            el.style.fontWeight = '600';
        }

        if (applicationId) {
            document.getElementById('applicationId').value = applicationId;
            try {
                const res = await ApplicationsAPI.getById(applicationId);
                if (res.ok && res.data && res.data.success && res.data.application) {
                    const app = res.data.application;
                    if (app.candidateId) { document.getElementById('candidateId').value = app.candidateId; lockIdField('candidateId'); }
                    if (app.jobId) { document.getElementById('jobId').value = app.jobId; lockIdField('jobId'); }

                    const banner = document.getElementById('candidateBanner');
                    const candName = app.candidate ? app.candidate.name : 'Candidate';
                    const candEmail = app.candidate ? app.candidate.email : '';
                    const jobTitle = app.job ? app.job.title : 'Job';
                    const jobComp = app.job ? app.job.company : '';
                    document.getElementById('bannerCandidateName').textContent = `\u{1F464} Application #${app.id}: ${candName} (${candEmail})`;
                    document.getElementById('bannerJobTitle').textContent = `\u{1F4BC} ${jobTitle} at ${jobComp}`;
                    banner.style.display = 'block';
                    return;
                } else {
                    document.getElementById('formError').textContent =
                        `\u26A0\uFE0F Application #${applicationId} not found. ${res.data?.message || 'Please navigate from the Applications page.'}`;
                }
            } catch (e) {
                console.warn('Could not fetch application details:', e);
                document.getElementById('formError').textContent =
                    '\u26A0\uFE0F Network error loading application. Please go back and try again.';
            }
        }

        // Fallback: use candidateId/jobId from URL if no applicationId lookup succeeded
        if (candidateId) {
            document.getElementById('candidateId').value = candidateId;
            lockIdField('candidateId');
        }
        if (jobId) {
            document.getElementById('jobId').value = jobId;
            lockIdField('jobId');
        }

        if (!applicationId && !candidateId && !jobId) {
            document.getElementById('formError').textContent =
                '\u26A0\uFE0F No application selected. Please navigate here from the Applications list.';
        }

        // Fetch and display candidate + job info in the banner
        if (candidateId) {
            try {
                const res = await fetch(`http://localhost:5000/api/users/${candidateId}`, {
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });
                const data = await res.json();
                if (data.success && data.user) {
                    document.getElementById('bannerCandidateName').textContent = `\u{1F464} ${data.user.name} (${data.user.email})`;
                    document.getElementById('candidateBanner').style.display = 'block';
                }
            } catch (e) {}
        }
        if (jobId) {
            try {
                const jobRes = await JobsAPI.getById(jobId);
                if (jobRes.ok && jobRes.data.job) {
                    document.getElementById('bannerJobTitle').textContent =
                        `\u{1F4BC} ${jobRes.data.job.title} at ${jobRes.data.job.company}`;
                    document.getElementById('candidateBanner').style.display = 'block';
                }
            } catch (e) {}
        }
    }

    async function handleSchedule(event) {
        event.preventDefault();
        const btn = document.getElementById('scheduleBtn');
        const errEl = document.getElementById('formError');
        const statusEl = document.getElementById('statusMsg');
        errEl.textContent = '';
        statusEl.textContent = '';

        const candidateId = parseInt(document.getElementById('candidateId').value);
        const jobId = parseInt(document.getElementById('jobId').value);
        const applicationId = parseInt(document.getElementById('applicationId').value) || undefined;
        const scheduledAt = document.getElementById('scheduledAt').value;
        const mode = document.getElementById('mode').value;
        const location = document.getElementById('location').value.trim();
        const notes = document.getElementById('notes').value.trim();

        if (!candidateId || !jobId || !scheduledAt) {
            errEl.textContent = 'Candidate ID, Job ID, and date/time are required.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Scheduling...';

        try {
            const payload = {
                candidateId,
                jobId,
                scheduledAt: new Date(scheduledAt).toISOString(),
                mode,
                location: location || null,
                notes: notes || null
            };
            if (applicationId) payload.applicationId = applicationId;

            const res = await InterviewsAPI.schedule(payload);

            if (res.ok && res.data.success) {
                showToast('Interview scheduled successfully!', 'success');
                statusEl.style.color = 'green';
                statusEl.textContent = '✅ Interview scheduled! The candidate has been notified.';
                btn.textContent = 'Schedule Another';
                btn.disabled = false;
                document.getElementById('interviewForm').reset();
                setTimeout(() => {
                    window.location.href = 'interview-success.html';
                }, 1500);
            } else {
                errEl.textContent = res.data.message || 'Failed to schedule interview.';
                btn.disabled = false;
                btn.textContent = 'Schedule Interview';
            }
        } catch (e) {
            errEl.textContent = 'Network error. Please try again.';
            btn.disabled = false;
            btn.textContent = 'Schedule Interview';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (!requireAuth('RECRUITER')) return;
        prefillFromUrl();
    });
</script>
</body>
</html>
