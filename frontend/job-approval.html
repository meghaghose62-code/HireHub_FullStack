<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireHub - Job Approval</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; }
    body { background:#f5f6fa; }

    /* Top Bar */
    .navbar {
        background:#0a66c2;
        padding:15px 30px;
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    .navbar h2 { font-size:22px; }
    .navbar button {
        background:white; color:#0a66c2; border:none;
        padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600;
    }

    /* Content */
    .content {
        padding:40px;
        height:calc(100vh - 60px);
        overflow-y:auto;
    }

    .card {
        background:white;
        padding:25px;
        border-radius:10px;
        box-shadow:0 1px 5px rgba(0,0,0,0.1);
    }

    .card h3 {
        margin-bottom:15px;
        color:#0a66c2;
        font-size:20px;
    }

    table {
        width:100%;
        border-collapse:collapse;
    }

    th, td {
        padding:12px;
        border:1px solid #ddd;
        text-align:left;
    }

    th {
        background:#f1f7ff;
        color:#0a66c2;
    }

    button.action-btn {
        padding:6px 12px;
        border:none;
        border-radius:5px;
        cursor:pointer;
        color:white;
        background:#0a66c2;
        margin-right:5px;
        transition:0.2s ease;
    }

    button.reject-btn {
        background:#e74c3c;
    }

    button.action-btn:hover { opacity:0.85; }

    /* Toast Notification */
    #toast {
        visibility: hidden;
        min-width: 250px;
        margin-left: -125px;
        background-color: #0a66c2;
        color: #fff;
        text-align: center;
        border-radius: 8px;
        padding: 12px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 30px;
        font-size: 16px;
        opacity: 0;
        transition: opacity 0.5s, bottom 0.5s;
    }
    #toast.show {
        visibility: visible;
        opacity: 1;
        bottom: 50px;
    }
</style>
</head>
<body>

<div class="navbar">
    <h2>HireHub Admin - Job Approval</h2>
    <button onclick="location.href='admin-dashboard.html'">Back to Dashboard</button>
</div>

<div class="content">
    <div class="card">
        <h3>Pending Job Posts</h3>
        <table id="jobTable">
            <thead>
                <tr>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>Posted By</th>
                    <th>Location</th>
                    <th>Posted On</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="jobTableBody">
                <tr id="loadingRow">
                    <td colspan="6" style="text-align:center;padding:20px;color:#666;">Loading pending jobs...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth('ADMIN')) return;
    loadPendingJobs();
});

async function loadPendingJobs() {
    const tbody = document.getElementById('jobTableBody');
    try {
        const res = await JobsAPI.getPending();
        if (res.ok && res.data && res.data.jobs) {
            tbody.innerHTML = '';
            if (res.data.jobs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:25px;color:#28a745;font-weight:600;">✓ No pending jobs awaiting approval. All clear!</td></tr>';
                return;
            }

            res.data.jobs.forEach(job => {
                const tr = document.createElement('tr');
                const postedDate = new Date(job.postedAt).toLocaleDateString('en-IN', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });
                const recruiterInfo = job.recruiter ? `${job.recruiter.name} (${job.recruiter.email})` : 'Recruiter';

                tr.innerHTML = `
                    <td><strong>${escapeHtml(job.title)}</strong><br><small style="color:#666;">${escapeHtml(job.skills || '')}</small></td>
                    <td>${escapeHtml(job.company)}</td>
                    <td>${escapeHtml(recruiterInfo)}</td>
                    <td>${escapeHtml(job.location)}</td>
                    <td>${postedDate}</td>
                    <td>
                        <button class="action-btn" onclick="handleApprove(${job.id}, '${escapeHtml(job.title)}', this)">Approve</button>
                        <button class="action-btn reject-btn" onclick="handleReject(${job.id}, '${escapeHtml(job.title)}', this)">Reject</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:red;padding:15px;">Failed to load pending jobs from server.</td></tr>';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
}

async function handleApprove(jobId, jobTitle, button) {
    button.disabled = true;
    try {
        const res = await JobsAPI.approve(jobId, 'APPROVED');
        if (res.ok && res.data.success) {
            button.closest('tr').remove();
            showToast(`✅ Job "${jobTitle}" has been approved!`);
            checkEmptyTable();
        } else {
            showToast(res.data.message || 'Error approving job.');
            button.disabled = false;
        }
    } catch (e) {
        showToast('Network error approving job.');
        button.disabled = false;
    }
}

async function handleReject(jobId, jobTitle, button) {
    if (!confirm(`Are you sure you want to reject "${jobTitle}"?`)) return;
    button.disabled = true;
    try {
        const res = await JobsAPI.approve(jobId, 'REJECTED');
        if (res.ok && res.data.success) {
            button.closest('tr').remove();
            showToast(`❌ Job "${jobTitle}" has been rejected.`);
            checkEmptyTable();
        } else {
            showToast(res.data.message || 'Error rejecting job.');
            button.disabled = false;
        }
    } catch (e) {
        showToast('Network error rejecting job.');
        button.disabled = false;
    }
}

function checkEmptyTable() {
    const tbody = document.getElementById('jobTableBody');
    if (tbody.querySelectorAll('tr').length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:25px;color:#28a745;font-weight:600;">✓ No pending jobs awaiting approval. All clear!</td></tr>';
    }
}

function showToast(message) {
    let toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "show";
    setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
}
</script>
</body>
</html>
