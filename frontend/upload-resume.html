<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireHub - Upload Resume</title>
<style>
    * { margin:0; padding:0; font-family:Poppins,sans-serif; box-sizing:border-box; }
    body { background:#f5f6fa; }

    .navbar {
        background:#0a66c2;
        padding:15px 30px;
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    .navbar button {
        background:white; color:#0a66c2; border:none;
        padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600;
    }

    .container {
        max-width:600px;
        background:white;
        margin:30px auto;
        padding:25px;
        border-radius:8px;
        box-shadow:0 1px 4px rgba(0,0,0,0.1);
    }

    h3 { text-align:center; color:#0a66c2; margin-bottom:20px; }

    input[type="file"] {
        width:100%;
        padding:10px;
        border:2px dashed #0a66c2;
        border-radius:6px;
        margin-top:8px;
        background:#f0f7ff;
        cursor:pointer;
    }

    button.upload-btn {
        width:100%;
        background:#0a66c2;
        border:none;
        color:white;
        padding:12px;
        border-radius:6px;
        margin-top:18px;
        font-size:16px;
        cursor:pointer;
        font-weight:600;
    }

    button.upload-btn:hover { background:#084d94; }
    button.upload-btn:disabled { background:#ccc; cursor:not-allowed; }

    .note {
        font-size:13px;
        margin-top:8px;
        color:gray;
    }

    #statusMsg {
        text-align:center;
        margin-top:12px;
        font-size:14px;
        font-weight:600;
        min-height:20px;
    }

    .resume-list { margin-top:25px; }
    .resume-list h4 { color:#0a66c2; margin-bottom:10px; }
    .resume-item {
        background:#f5f5f5;
        padding:10px 14px;
        border-radius:6px;
        margin-bottom:8px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-size:14px;
    }
    .resume-item .del-btn {
        background:#e74c3c;
        color:white;
        border:none;
        padding:4px 10px;
        border-radius:5px;
        cursor:pointer;
        font-size:13px;
    }
    .resume-item .del-btn:hover { background:#c0392b; }
</style>
</head>
<body>

<div class="navbar">
    <h2>📎 Upload Resume</h2>
    <button onclick="location.href='dashboard.html'">Dashboard</button>
</div>

<div class="container">
    <h3>Upload / Update Your Resume</h3>

    <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">
    <p class="note">Supported formats: PDF, DOC, DOCX (Max size 5MB)</p>

    <p id="statusMsg"></p>

    <button class="upload-btn" id="uploadBtn" onclick="uploadResume()">Upload Resume</button>

    <div class="resume-list" id="resumeListSection" style="display:none;">
        <h4>📁 Your Uploaded Resumes</h4>
        <div id="resumeListItems"></div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    async function loadMyResumes() {
        try {
            const res = await ResumesAPI.getMine();
            if (res.ok && res.data.success && res.data.resumes.length > 0) {
                const section = document.getElementById('resumeListSection');
                const list = document.getElementById('resumeListItems');
                section.style.display = 'block';
                list.innerHTML = '';

                res.data.resumes.forEach(r => {
                    const date = new Date(r.uploadedAt).toLocaleDateString('en-IN', {
                        day: 'numeric', month: 'short', year: 'numeric'
                    });
                    const item = document.createElement('div');
                    item.className = 'resume-item';
                    item.id = `resume-${r.id}`;
                    item.innerHTML = `
                        <span>📄 <strong>${escapeHtml(r.fileName)}</strong> <small style="color:#888;">(${date})</small></span>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <a href="${escapeHtml(r.filePath)}" target="_blank" style="color:#0a66c2;font-size:13px;text-decoration:none;font-weight:600;">View</a>
                            <button class="del-btn" onclick="handleDeleteResume(${r.id})">Delete</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }
        } catch (e) {
            console.warn('Could not load resumes:', e);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    async function uploadResume() {
        const file = document.getElementById('resumeFile').files[0];
        const statusEl = document.getElementById('statusMsg');
        const btn = document.getElementById('uploadBtn');

        statusEl.style.color = '#333';
        statusEl.textContent = '';

        if (!file) {
            statusEl.style.color = 'red';
            statusEl.textContent = '⚠ Please select a resume file.';
            return;
        }

        const allowedExtensions = /\.(pdf|doc|docx)$/i;
        if (!allowedExtensions.test(file.name)) {
            statusEl.style.color = 'red';
            statusEl.textContent = '❌ Invalid file type. Only PDF, DOC, DOCX allowed.';
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            statusEl.style.color = 'red';
            statusEl.textContent = '❌ File too large! Maximum size is 5MB.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Uploading...';
        statusEl.style.color = '#0a66c2';
        statusEl.textContent = '⏳ Uploading your resume...';

        const formData = new FormData();
        formData.append('resume', file);

        try {
            const res = await ResumesAPI.upload(formData);
            if (res.ok && res.data.success) {
                statusEl.style.color = 'green';
                statusEl.textContent = '✅ Resume uploaded successfully!';
                document.getElementById('resumeFile').value = '';
                btn.textContent = 'Upload Another';
                btn.disabled = false;
                showToast('Resume uploaded successfully!', 'success');
                // Reload resume list
                document.getElementById('resumeListItems').innerHTML = '';
                loadMyResumes();
            } else {
                statusEl.style.color = 'red';
                statusEl.textContent = '❌ ' + (res.data.message || 'Upload failed.');
                btn.disabled = false;
                btn.textContent = 'Upload Resume';
            }
        } catch (e) {
            statusEl.style.color = 'red';
            statusEl.textContent = '❌ Network error. Is the server running?';
            btn.disabled = false;
            btn.textContent = 'Upload Resume';
        }
    }

    async function handleDeleteResume(id) {
        if (!confirm('Delete this resume?')) return;
        try {
            const res = await ResumesAPI.delete(id);
            if (res.ok && res.data.success) {
                const el = document.getElementById(`resume-${id}`);
                if (el) el.remove();
                showToast('Resume deleted', 'success');
                // Hide section if empty
                const remaining = document.querySelectorAll('.resume-item');
                if (remaining.length === 0) {
                    document.getElementById('resumeListSection').style.display = 'none';
                }
            } else {
                showToast(res.data.message || 'Failed to delete', 'error');
            }
        } catch (e) {
            showToast('Network error deleting resume', 'error');
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (!requireAuth('CANDIDATE')) return;
        loadMyResumes();
    });
</script>
</body>
</html>
